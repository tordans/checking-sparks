  <path d="M150 290 L214 354 L318 228" fill="none" stroke="#ffffff" stroke-width="48" stroke-linecap="round" stroke-linejoin="round" />
  <!-- spark: four-pointed star, the one accent color -->
  <path d="M358 90 Q358 134 402 134 Q358 134 358 178 Q358 134 314 134 Q358 134 358 90 Z" fill="#fde047" stroke="#fde047" stroke-width="14" stroke-linejoin="round" />
</svg>
